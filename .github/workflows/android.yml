name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install NDK + CMake
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build fwr debug APK
        working-directory: android/launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleFwrDebug

      - uses: actions/upload-artifact@v4
        with:
          name: re3-fwr-debug-apk
          path: android/launcher/app/build/outputs/apk/fwr/debug/*.apk
